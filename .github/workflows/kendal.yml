name: Build Weatherglass TV (Kendal)
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK parts
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms" || true
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "build-tools;34.0.0" "platforms;android-34"
      - name: Write config
        run: |
          cat > config.properties <<'EOF'
          latitude=-6.92
          longitude=110.20
          city=Kendal
          tmdb_region=ID
          language=id
          temperature=C
          EOF
      - name: Build
        run: chmod +x build.sh && ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV
          path: FreeMyTV.apk
